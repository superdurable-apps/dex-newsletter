openapi: 3.0.3
info:
  title: Dex Blog Newsletter API
  version: 1.0.0
  description: >-
    Public reader surface only. Editors manage blog posts and subscribers in Dex Web.
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Application is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/application-info:
    get:
      operationId: getApplicationInfo
      responses:
        '200':
          description: Publication name and optional Dex Web link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationInfo'
  /api/newsletter/subscriptions:
    post:
      operationId: subscribeToNewsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '200':
          description: The address is subscribed, now or already.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/newsletter/unsubscriptions:
    post:
      operationId: unsubscribeFromNewsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsubscriptionRequest'
      responses:
        '200':
          description: The address is no longer subscribed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/drafts/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getDraft
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: The draft and its published rendering.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftEditorView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: saveDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftSaveRequest'
      responses:
        '200':
          description: Saved as the next draft version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftChangeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/drafts/{runId}/preview:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: previewDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftPreviewRequest'
      responses:
        '200':
          description: Unsaved edits rendered as they would ship.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/drafts/{runId}/approval:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: approveDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftApprovalRequest'
      responses:
        '200':
          description: Approved; delivery starts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftChangeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,200}$'
  schemas:
    BlogSection:
      type: object
      additionalProperties: false
      required: [heading, paragraphs, bullets]
      properties:
        heading: {type: string, maxLength: 1000}
        paragraphs: {type: array, maxItems: 50, items: {type: string, maxLength: 10000}}
        bullets: {type: array, maxItems: 50, items: {type: string, maxLength: 2000}}
    BlogHighlight:
      type: object
      additionalProperties: false
      required: [title, description, url]
      properties:
        title: {type: string, maxLength: 1000}
        description: {type: string, maxLength: 2000}
        url: {type: string, maxLength: 2048}
    BlogDraft:
      type: object
      additionalProperties: false
      required: [title, subtitle, slug, summary, sections, highlights, closing]
      properties:
        title: {type: string, maxLength: 1000}
        subtitle: {type: string, maxLength: 1000}
        slug: {type: string, maxLength: 200}
        summary: {type: string, maxLength: 5000}
        sections: {type: array, maxItems: 30, items: {$ref: '#/components/schemas/BlogSection'}}
        highlights: {type: array, maxItems: 30, items: {$ref: '#/components/schemas/BlogHighlight'}}
        closing: {type: string, maxLength: 5000}
    DraftEditorView:
      type: object
      additionalProperties: false
      description: The post and its two renderings; the email is the same post in email formatting.
      required: [runId, status, editable, draftVersion, revisionCount, blog, blogHtml, emailSubject, emailHtml]
      properties:
        runId: {type: string}
        status: {type: string}
        editable: {type: boolean}
        draftVersion: {type: integer, format: int64}
        revisionCount: {type: integer, format: int64}
        blog: {$ref: '#/components/schemas/BlogDraft'}
        blogHtml: {type: string}
        emailSubject: {type: string}
        emailHtml: {type: string}
    DraftSaveRequest:
      type: object
      additionalProperties: false
      required: [token, baseVersion, blog]
      properties:
        token: {type: string, minLength: 1, maxLength: 128}
        baseVersion: {type: integer, format: int64}
        blog: {$ref: '#/components/schemas/BlogDraft'}
    DraftPreviewRequest:
      type: object
      additionalProperties: false
      required: [token, blog]
      properties:
        token: {type: string, minLength: 1, maxLength: 128}
        blog: {$ref: '#/components/schemas/BlogDraft'}
    DraftPreview:
      type: object
      additionalProperties: false
      required: [valid, blogHtml, emailSubject, emailHtml]
      properties:
        valid: {type: boolean}
        message: {type: string}
        blogHtml: {type: string}
        emailSubject: {type: string}
        emailHtml: {type: string}
    DraftApprovalRequest:
      type: object
      additionalProperties: false
      required: [token, baseVersion]
      properties:
        token: {type: string, minLength: 1, maxLength: 128}
        baseVersion: {type: integer, format: int64}
    DraftChangeResult:
      type: object
      additionalProperties: false
      required: [outcome, draftVersion]
      properties:
        outcome:
          type: string
          enum: [saved, approved]
        draftVersion: {type: integer, format: int64}
    ApplicationInfo:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        dexWebUrl:
          type: string
    SubscriptionRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
    SubscriptionResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [subscribed, already_subscribed]
    UnsubscriptionRequest:
      type: object
      additionalProperties: false
      required: [email, token]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        token:
          type: string
          minLength: 1
          maxLength: 128
    UnsubscriptionResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [unsubscribed, not_subscribed]
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        message:
          type: string
          maxLength: 3000
  responses:
    Forbidden:
      description: The editor link is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The run was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The request conflicts with the current state (a full subscriber list, or a draft that changed or left review).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: The service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
