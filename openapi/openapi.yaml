openapi: 3.0.3
info:
  title: Dex Tech Blog API
  version: 1.0.0
paths:
  /api/application-info:
    get:
      operationId: getApplicationInfo
      responses:
        '200':
          description: Application identity for the home page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationInfo'
  /api/newsletter/subscriptions:
    post:
      operationId: subscribeToNewsletter
      description: >-
        Adds one email address to the newsletter subscriber list. Subscribing an
        address that is already on the list succeeds with the same response,
        and a full list answers 409 for every valid address, so no response
        reveals list membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsletterSubscriptionRequest'
      responses:
        '200':
          description: The address is on the newsletter subscriber list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsletterSubscription'
        '400':
          description: The email address is not a single, deliverable address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The subscriber list is full; answered for every valid address, subscribed or not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The subscriber list is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/newsletter/unsubscriptions:
    post:
      operationId: unsubscribeFromNewsletter
      description: >-
        Removes the subscriber named by the token of a newsletter unsubscribe
        link. A token that names no current subscriber gets the same response,
        so the response never reveals list membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsletterUnsubscriptionRequest'
      responses:
        '200':
          description: The subscriber named by the token, if any, is no longer on the list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsletterUnsubscription'
        '400':
          description: The token is not an unsubscribe token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The subscriber list is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    NewsletterUnsubscriptionRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{22}$'
    NewsletterUnsubscription:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [unsubscribed]
    NewsletterSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
    NewsletterSubscription:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          description: The subscribed address in its canonical lowercase form.
    Error:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
    ApplicationInfo:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        dexWebUrl:
          type: string
